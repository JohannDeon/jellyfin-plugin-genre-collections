<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1280px;height:720px;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif;
background:radial-gradient(circle at 20% 15%,#2b1840 0,#101018 55%),#101018;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:linear-gradient(120deg,rgba(170,92,195,.35),rgba(0,164,220,.30));opacity:.55}
.stack{position:absolute;left:80px;top:150px;width:520px;height:420px}
.card{position:absolute;width:250px;height:370px;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55);
display:flex;flex-direction:column;justify-content:flex-end;padding:22px;box-sizing:border-box;font-weight:700;font-size:30px;letter-spacing:.5px}
.c1{left:-30px;top:50px;transform:rotate(-12deg);background:linear-gradient(160deg,#7b2d8e,#2a0f35)}
.c2{left:130px;top:10px;transform:rotate(0deg);background:linear-gradient(160deg,#0e7fb0,#082a3d);z-index:2}
.c3{left:290px;top:50px;transform:rotate(12deg);background:linear-gradient(160deg,#b23a3a,#3a0f12);z-index:1}
.icon{font-size:110px;line-height:1;margin-bottom:auto;margin-top:30px;text-align:center;opacity:.9}
.label{background:rgba(0,0,0,.35);border-radius:10px;padding:8px 12px;text-align:center}
.title{position:absolute;left:690px;top:215px;width:560px}
h1{margin:0;font-size:84px;line-height:1;font-weight:800;background:linear-gradient(90deg,#c27be0,#3fc3f2);-webkit-background-clip:text;color:transparent}
p{margin:26px 0 0;font-size:34px;color:#c9cbd6;line-height:1.3}
</style></head><body><div class="glow"></div>
<div class="stack">
 <div class="card c1"><div class="icon">👻</div><div class="label">Horreur</div></div>
 <div class="card c3"><div class="icon">🚀</div><div class="label">Sci-Fi</div></div>
 <div class="card c2"><div class="icon">🎭</div><div class="label">Comédie</div></div>
</div>
<div class="title"><h1>Genre<br>Collections</h1><p>Tes films et séries<br>rangés par genre</p></div>
</body></html>
