name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.GenreCollections/Jellyfin.Plugin.GenreCollections.csproj -c Release -o artifacts/publish

      - name: Package
        run: |
          mkdir -p artifacts/zip
          cp artifacts/publish/Jellyfin.Plugin.GenreCollections.dll artifacts/zip/
          cd artifacts/zip && zip -r ../genre-collections.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: genre-collections
          path: artifacts/genre-collections.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/genre-collections.zip
