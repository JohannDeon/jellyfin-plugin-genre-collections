name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="$(grep -Po '^version: "\K[^"]+' build.yaml | cut -d. -f1-3)"
          fi
          echo "short=$v" >> "$GITHUB_OUTPUT"
          echo "full=$v.0" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish Jellyfin.Plugin.GenreCollections/Jellyfin.Plugin.GenreCollections.csproj -c Release -o artifacts/publish
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.full }}
          -p:FileVersion=${{ steps.version.outputs.full }}

      - name: Package
        run: |
          mkdir -p artifacts/zip
          cp artifacts/publish/Jellyfin.Plugin.GenreCollections.dll artifacts/zip/
          cd artifacts/zip && zip -r "../genre-collections_${{ steps.version.outputs.full }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: genre-collections
          path: artifacts/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

      - name: Update plugin repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          zip="artifacts/genre-collections_${{ steps.version.outputs.full }}.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$zip")"
          abi="$(grep -Po '^targetAbi: "\K[^"]+' build.yaml)"
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py manifest.json "$zip" "${{ steps.version.outputs.full }}" "$abi" "$url" "Voir https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest: ${GITHUB_REF_NAME}"
          git push origin main
