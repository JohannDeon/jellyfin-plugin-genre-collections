overview: "Collections automatiques par genre et rangées d'accueil"
description: >
  Crée et maintient une collection par genre (Horreur, Comédie, ...) pour les films
  et les séries, et ajoute sur l'écran d'accueil des rangées « Nouveaux films »,
  « Séries avec de nouveaux épisodes », « Collections par genre » et une rangée par genre,
  sans ajouter de CSS (le thème installé garde la main).
