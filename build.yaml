name: "Genre Collections"
guid: "51657d44-7198-4c95-b99d-afef3045fad9"
version: "1.4.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Collections automatiques par genre et rangées d'accueil"
description: >
  Crée et maintient une collection par genre (Horreur, Comédie, ...) pour les films
  et les séries, et ajoute sur l'écran d'accueil des rangées « Nouveaux films »,
  « Séries avec de nouveaux épisodes », « Collections par genre » et une rangée par genre,
  sans ajouter de CSS (le thème installé garde la main).
category: "General"
owner: "JohannDeon"
artifacts:
- "Jellyfin.Plugin.GenreCollections.dll"
changelog: >
  Accueil plus léger : affiches chargées seulement quand elles arrivent à l'écran, rangées chargées au fil du défilement, 4 requêtes au plus en même temps.
  Nouveaux réglages par défaut (sans changer ceux des installations existantes) : « Nouveaux films », « Tous les films » et « Toutes les séries » désactivés, 4 rangées de genre, 16 titres par rangée.
  Les genres de moins de 5 titres n'ont plus de rangée. Le fichier index.html n'est plus modifié sur le disque (injection à la volée, compatible Theme Studio et Docker en lecture seule).
